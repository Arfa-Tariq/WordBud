{% extends 'base.html' %}
{% block title %}WordBud - Games{% endblock %}
{% block content %}
<div style="max-width:800px;margin:40px auto;text-align:center;">
  <h1 style="color:#4a90e2;margin-bottom:20px;">🎮 Word Games Hub</h1>
  <p style="color:#555;margin-bottom:30px;">Choose a fun way to improve your vocabulary!</p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;">
    {% for game in games %}
    <a href="{% url game.url %}" style="text-decoration:none;">
      <div style="background:white;border:1px solid #eee;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1);transition:transform 0.3s;">
        <div style="font-size:2rem;">{{ game.emoji }}</div>
        <h3 style="color:#333;margin:10px 0;">{{ game.name }}</h3>
      </div>
    </a>
    {% endfor %}
  </div>
</div>
{% endblock %}
