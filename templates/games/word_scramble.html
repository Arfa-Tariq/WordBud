{% extends "base.html" %}
{% block content %}
<div style="max-width:600px;margin:2rem auto;text-align:center;">
  <h1 style="color:#333;">🔠 Word Scramble</h1>
  <p style="font-size:1.2rem;margin:1rem 0;">Unscramble the letters to form a correct word.</p>

  <h2 style="letter-spacing:0.2rem;color:#0077cc;">{{ scrambled|upper }}</h2>

  {% if not game_over %}
    <form method="POST" style="margin-top:1.5rem;">
      {% csrf_token %}
      <input type="text" name="guess" placeholder="Your guess" required
             style="padding:0.5rem;width:60%;border:1px solid #ccc;border-radius:5px;">
      <button type="submit" style="padding:0.5rem 1rem;background:#333;color:white;border:none;border-radius:5px;">Submit</button>
    </form>
  {% endif %}

  <p style="margin-top:1.5rem;color:#555;">{{ message }}</p>

  {% if game_over %}
    <a href="{% url 'games:word_scramble' %}" style="display:inline-block;margin-top:1rem;padding:0.5rem 1rem;background:#0077cc;color:white;border-radius:5px;text-decoration:none;">Play Again</a>
    <a href="{% url 'games:game_hub' %}" style="margin-left:1rem;">Back to Games</a>
  {% endif %}
</div>
{% endblock %}
