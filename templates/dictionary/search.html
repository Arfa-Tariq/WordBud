{% extends 'base.html' %}
{% block content %}
<h2>Search Word</h2>
<form action="{% url 'dictionary:search' %}" method="get">
  <input type="text" name="q" placeholder="Enter a word..." required>
  <button type="submit">Search</button>
  <a href="{% url 'dictionary:random_word' %}">Random Word</a>
</form>
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}
{% endblock %}
