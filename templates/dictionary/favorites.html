{% extends "base.html" %}
{% block content %}
<h2>Your Favorite Words</h2>
{% if favorites %}
  <ul>
    {% for fav in favorites %}
      <li>
        {{ fav.word }}
        <a href="{% url 'dictionary:remove_favorite' fav.word %}">Remove</a>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p>No favorite words yet.</p>
{% endif %}
{% endblock %}
